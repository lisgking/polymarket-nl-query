name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not available on ubuntu-latest (26.04), pin 24.04
          - python-version: "3.9"
            runs-on: ubuntu-24.04
          - python-version: "3.10"
            runs-on: ubuntu-latest
          - python-version: "3.12"
            runs-on: ubuntu-latest
          - python-version: "3.13"
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests (offline)
        run: python -m unittest discover -s tests -q
      - name: schema smoke
        run: python bin/nlq.py schema > /dev/null
      - name: build smoke
        run: |
          python bin/nlq.py build --intent '{"tag_ids":[2],"closed":false,"volume":{"min":"100万"},"end_before":"rel:+30d"}' \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'], d['errors']; assert 'volume_min=1000000' in d['url']"
