name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: unit tests (offline)
        run: node --test tests/nlq.test.mjs
      - name: schema smoke
        run: node bin/nlq.mjs schema > /dev/null
      - name: build smoke
        run: |
          node bin/nlq.mjs build --intent '{"tag_ids":[2],"closed":false,"volume":{"min":"100万"},"end_before":"rel:+30d"}' > /tmp/out.json
          node -e "const d=require('/tmp/out.json'); if(!d.ok) throw new Error(JSON.stringify(d.errors)); if(!d.url.includes('volume_min=1000000')) throw new Error('bad url: '+d.url);"
